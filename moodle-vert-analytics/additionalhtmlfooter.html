<!-- Vert Analytics: botão "?" para reiniciar o tour da página + ajuste de texto em inglês do tema -->
<script>
(function () {
    function addHelpButton() {
        if (document.querySelector('.vert-tour-help')) { return; }
        var title = document.querySelector('#page-header .page-header-headings h1.header-heading') ||
                    document.querySelector('body#page-site-index .axia-content-v2 h1');
        if (!title) { return; }
        var a = document.createElement('a');
        a.href = '#';
        a.className = 'vert-tour-help';
        a.setAttribute('role', 'button');
        a.title = 'Ver o tour guiado desta página';
        a.setAttribute('aria-label', a.title);
        a.textContent = '?';
        a.addEventListener('click', function (e) {
            e.preventDefault();
            // O Moodle reinicia o tour quando o link #resetpagetour (no rodapé, oculto) é clicado.
            var link = document.getElementById('resetpagetour');
            if (link) { link.click(); }
        });
        title.appendChild(a);
    }
    function pageHasTour() {
        var scripts = document.scripts;
        for (var i = 0; i < scripts.length; i++) {
            if (/tool_usertours\/usertours/.test(scripts[i].textContent || '')) { return true; }
        }
        return false;
    }
    function fixMarkAllRead() {
        var links = document.querySelectorAll('[data-action="mark-all-read"]');
        for (var i = 0; i < links.length; i++) {
            var p = links[i].querySelector('p');
            if (p && links[i].title && /mark all read/i.test(p.textContent)) { p.textContent = links[i].title; }
        }
    }
    function renameSiteMonitor() {
        // Bloco "Monitor do Site Edwiser" -> "Monitor do Site"
        var h = document.querySelector('.block_edwiser_site_monitor .block-header');
        if (h && /Edwiser/i.test(h.textContent)) { h.textContent = h.textContent.replace(/\s*Edwiser\s*/i, ' ').trim(); h.title = h.textContent; }
    }
    function run() {
        fixMarkAllRead();
        renameSiteMonitor();
        if (pageHasTour()) {
            // O tema pode re-renderizar o cabeçalho depois do carregamento (ex.: página do curso),
            // removendo o botão; por isso a verificação continua por um tempo.
            addHelpButton();
            var ticks = 0;
            var fast = setInterval(function () {
                ticks++;
                addHelpButton();
                if (ticks >= 60) { clearInterval(fast); setInterval(addHelpButton, 5000); }
            }, 1000);
        }
    }
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', run); } else { run(); }
})();
</script>
