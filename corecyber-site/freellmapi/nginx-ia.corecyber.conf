# Proxy público do assistente Cy do site CoreCyber → FreeLLMAPI (127.0.0.1:3001)
#
# - Expõe SOMENTE POST /v1/chat/completions (painel e demais rotas ficam fechados).
# - Injeta a chave unificada do FreeLLMAPI no servidor: o navegador nunca a vê.
# - CORS restrito ao site; limite de requisições por visitante; corpo pequeno.
#
# Instalação (Ubuntu/Debian com Nginx + Certbot):
#   1. Crie /etc/nginx/freellmapi-key.conf (permissão 600, dono root) com UMA linha:
#        set $freellm_key "freellmapi-SUA-CHAVE-UNIFICADA";
#   2. Copie este arquivo para /etc/nginx/sites-available/ia.corecyber.conf e ative:
#        ln -s /etc/nginx/sites-available/ia.corecyber.conf /etc/nginx/sites-enabled/
#   3. certbot --nginx -d ia.corecyber.com.br
#   4. nginx -t && systemctl reload nginx

limit_req_zone $binary_remote_addr zone=cc_ai:10m rate=12r/m;

map $http_origin $cc_cors {
    default "";
    "https://corecyber.com.br"     $http_origin;
    "https://www.corecyber.com.br" $http_origin;
}

server {
    listen 80;
    server_name ia.corecyber.com.br;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name ia.corecyber.com.br;

    # Preenchido pelo Certbot:
    # ssl_certificate     /etc/letsencrypt/live/ia.corecyber.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ia.corecyber.com.br/privkey.pem;

    include /etc/nginx/freellmapi-key.conf;

    client_max_body_size 32k;
    access_log off;   # não guardar perguntas nem IPs de visitantes (minimização — LGPD)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /v1/chat/completions {
        add_header Access-Control-Allow-Origin $cc_cors always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary Origin always;

        if ($request_method = OPTIONS) { return 204; }
        if ($request_method != POST)   { return 405; }
        if ($cc_cors = "")           { return 403; }

        limit_req zone=cc_ai burst=4 nodelay;
        limit_req_status 429;

        proxy_set_header Authorization "Bearer $freellm_key";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass_request_headers on;
        proxy_read_timeout 60s;
        proxy_pass http://127.0.0.1:3001/v1/chat/completions;
    }

    location / { return 404; }
}
