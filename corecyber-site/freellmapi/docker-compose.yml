# FreeLLMAPI para o assistente "Cy" do site CoreCyber.
# Baseado no docker-compose oficial: https://github.com/tashfeenahmed/freellmapi
# O serviço fica preso ao localhost; o acesso público passa SOMENTE pelo Nginx
# (nginx-ia.corecyber.conf), que injeta a chave unificada no servidor.
services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - freellmapi-data:/app/server/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ping').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  freellmapi-data:
